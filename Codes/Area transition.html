<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Area Transition / Camera Pan Demo</title>
    <style>
        body { background: #222; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { background: #111; border: 4px solid #444; display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h2>Area Transition / Camera Pan Demo</h2>
    <p>Walk to the right edge of Room 1 to trigger a smooth camera pan into Room 2!</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const screenWidth = 600;
const screenHeight = 400;

let player = { x: 100, y: 200, size: 20, speed: 4 };
let keys = {};

// Camera and transition states
let camera = { x: 0, y: 0 };
let isTransitioning = false;
let panTimer = 0;
let panDuration = 30; // Number of frames the pan takes (approx 0.5 seconds at 60fps)
let startPanX = 0;
let targetPanX = 0;

window.addEventListener("keydown", (e) => keys[e.key] = true);
window.addEventListener("keyup", (e) => keys[e.key] = false);

function update() {
    if (isTransitioning) {
        // During a transition, lock player movement and animate the camera pan
        panTimer++;
        let progress = panTimer / panDuration;
        
        // Ease-out formula for smooth motion
        let easeProgress = 1 - Math.pow(1 - progress, 3); 
        camera.x = startPanX + (targetPanX - startPanX) * easeProgress;

        if (panTimer >= panDuration) {
            isTransitioning = false; // End transition, unlock player
        }
        return;
    }

    // Normal movement inputs
    if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
    if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;
    if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
    if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;

    // Check for room transition triggers
    // Room 1 (x: 0 to 600) -> Room 2 (x: 600 to 1200)
    if (player.x > screenWidth - player.size && camera.x === 0) {
        // Trigger pan to Room 2
        isTransitioning = true;
        panTimer = 0;
        startPanX = 0;
        targetPanX = screenWidth;
        player.x = screenWidth + 20; // Push player slightly inside the new room
    } 
    // Room 2 -> Room 1
    else if (player.x < screenWidth && camera.x === screenWidth) {
        // Trigger pan back to Room 1
        isTransitioning = true;
        panTimer = 0;
        startPanX = screenWidth;
        targetPanX = 0;
        player.x = screenWidth - 40; // Push player back into Room 1
    }

    // Hard room bounds so player can't walk off the map edges
    if (player.x < 0) player.x = 0;
    if (player.x > screenWidth * 2 - player.size) player.x = screenWidth * 2 - player.size;
    if (player.y < 0) player.y = 0;
    if (player.y > screenHeight - player.size) player.y = screenHeight - player.size;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // Shift view based on the current camera pan position
    ctx.translate(-Math.floor(camera.x), 0);

    // --- DRAW ROOM 1 (Left) ---
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, 0, screenWidth, screenHeight);
    ctx.fillStyle = "#e94560";
    ctx.fillRect(200, 150, 80, 80); // Landmark in Room 1
    ctx.fillStyle = "#fff";
    ctx.font = "20px sans-serif";
    ctx.fillText("ROOM 1", 50, 50);

    // --- DRAW ROOM 2 (Right) ---
    ctx.fillStyle = "#16213e";
    ctx.fillRect(screenWidth, 0, screenWidth, screenHeight);
    ctx.fillStyle = "#0f3460";
    ctx.fillRect(screenWidth + 300, 150, 100, 100); // Landmark in Room 2
    ctx.fillStyle = "#fff";
    ctx.fillText("ROOM 2", screenWidth + 50, 50);

    // Divider wall indication
    ctx.strokeStyle = "#e94560";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(screenWidth, 0);
    ctx.lineTo(screenWidth, screenHeight);
    ctx.stroke();

    // Draw Player
    ctx.fillStyle = "#4ecc6d";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.restore();

    // UI Info overlay
    ctx.fillStyle = "#fff";
    ctx.font = "14px monospace";
    ctx.fillText(`Camera X: ${Math.round(camera.x)} | Transitioning: ${isTransitioning}`, 20, 30);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
